<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 五度妙笔</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Login page specific styles */
    .login-page {
      min-height: 100vh;
      display: flex;
      background: #fff;
    }
    .login-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      background: #fafafa;
    }
    .login-left h1 {
      font-size: 40px;
      font-weight: 700;
      color: #333;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .login-left h1 span { color: #4a6fa5; }
    .login-left .subtitle {
      font-size: 16px;
      color: #999;
      margin-bottom: 32px;
      font-weight: 300;
    }
    .login-left .desc {
      font-size: 14px;
      color: #666;
      line-height: 1.8;
      max-width: 420px;
      margin-bottom: 40px;
    }
    .login-left .contact {
      font-size: 13px;
      color: #999;
    }
    .login-left .contact strong { color: #666; }
    .login-left .qr-placeholder {
      margin-top: 20px;
      width: 120px;
      height: 120px;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #bbb;
      background: #fff;
    }

    .login-right {
      width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 40px 36px;
      background: #fff;
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .login-logo-icon {
      width: 36px;
      height: 36px;
      border: 2px solid #4a6fa5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #4a6fa5;
    }
    .login-logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #333;
    }
    .login-brand {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 24px;
    }

    .login-tabs {
      display: flex;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .login-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: #666;
      transition: all 0.15s;
    }
    .login-tab.active {
      background: #333;
      color: #fff;
    }
    .login-tab:not(.active):hover {
      background: #f5f5f5;
    }

    .login-form .input-group {
      margin-bottom: 16px;
    }
    .login-form .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
    }
    .input-with-btn {
      display: flex;
      gap: 8px;
    }
    .input-with-btn .input { flex: 1; }
    .input-with-btn .btn { flex-shrink: 0; }

    .login-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    .login-btn:hover { background: #555; }

    .login-hint {
      font-size: 12px;
      color: #bbb;
      text-align: center;
      margin-top: 12px;
    }

    .login-right-panel {
      display: none;
    }
    .login-right-panel.active {
      display: block;
    }

    @media (max-width: 900px) {
      .login-left { display: none; }
      .login-right { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="login-page">

    <!-- Left: Brand -->
    <div class="login-left">
      <h1><span>赋能万象</span>，智启未来</h1>
      <div class="subtitle">—— 您的专属智能工作台</div>
      <div class="desc">
        无论您面对何种挑战，我们的智能体矩阵都能提供精准、高效的解决方案。
        海量知识库支撑，专业模型驱动，助您轻松驾驭复杂业务。
      </div>
      <div class="contact">
        当前系统处于试运行阶段，试用期间如有任何问题或疑问，欢迎随时联系我们<br>
        <strong>联系电话：18510899258（微信同号）</strong>
      </div>
      <div class="qr-placeholder">二维码占位</div>
    </div>

    <!-- Right: Login form -->
    <div class="login-right">
      <div class="login-card">
        <div class="login-logo">
          <div class="login-logo-icon">5</div>
          <div>
            <div class="login-logo-text">5度易链</div>
            <div style="font-size:10px;color:#bbb;letter-spacing:1px;">5 DEGREE EASY CHAIN</div>
          </div>
        </div>
        <div class="login-brand">五度妙笔</div>

        <!-- Login tabs -->
        <div class="login-tabs">
          <div class="login-tab active" data-tab="sms" onclick="switchTab('sms')">短信登录</div>
          <div class="login-tab" data-tab="pwd" onclick="switchTab('pwd')">密码登录</div>
        </div>

        <!-- SMS Login -->
        <div class="login-right-panel active" id="panel-sms">
          <div class="login-form">
            <div class="input-group">
              <label>手机号</label>
              <input class="input" type="text" placeholder="请输入手机号">
            </div>
            <div class="input-group">
              <label>验证码</label>
              <div class="input-with-btn">
                <input class="input" type="text" placeholder="请输入验证码">
                <button class="btn btn-outline" onclick="getCode(this)" style="white-space:nowrap;">获取验证码</button>
              </div>
            </div>
            <button class="login-btn" onclick="doLogin()">登录/注册</button>
            <div class="login-hint">未注册账号？登录即自动注册</div>
          </div>
        </div>

        <!-- Password Login -->
        <div class="login-right-panel" id="panel-pwd">
          <div class="login-form">
            <div class="input-group">
              <label>手机号 / 邮箱</label>
              <input class="input" type="text" placeholder="请输入手机号或邮箱">
            </div>
            <div class="input-group">
              <label>密码</label>
              <input class="input" type="password" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="doLogin()">登录/注册</button>
            <div class="login-hint">未注册账号？登录即自动注册</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-right-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`.login-tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
    }

    function getCode(btn) {
      if (btn.disabled) return;
      let count = 60;
      btn.disabled = true;
      btn.style.color = '#bbb';
      btn.textContent = `${count}s`;
      const timer = setInterval(() => {
        count--;
        btn.textContent = `${count}s`;
        if (count <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.style.color = '';
          btn.textContent = '重新获取';
        }
      }, 1000);
    }

    function doLogin() {
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
