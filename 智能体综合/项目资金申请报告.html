<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>项目资金申请报告</title>
  <link rel="stylesheet" href="agent-shell.css">
  <link rel="stylesheet" href="agent-flow.css">
</head>
<body>
<div id="agentShellRoot"></div>
<script>
window.AGENT_CONFIG = {
  name: '项目资金申请报告',
  steps: ['编辑基本信息', '上传项目信息', '生成中', '完整报告输出'],
  flow: [
    { key: 'form', primary: '下一步' },
    { key: 'upload', primary: '生成报告' }
  ],
  genMinutes: 30,
  note: '提示：由于各省对申报文本格式、内容要求有所不同，智能体生成的文本仅做参考，需根据各省要求和企业实际情况调整或补充相应内容。',
  form: {
    title: '项目基础信息',
    fields: [
      { label: '项目名称', required: true, max: 80, placeholder: '示例：**公司**项目', hint: '项目名称一般为“企业名称+项目核心内容、目标”' },
      { label: '企业名称', required: true, max: 30, placeholder: '请输入完整的企业名称', hint: '务必填写项目单位全称，不要填写简称，避免模型因为无法识别到正确企业浪费报告生成次数' },
      { label: '项目建设内容、规模', required: true, type: 'textarea', max: 400, placeholder: '示例：项目建设期（具体到月）、占地面积、用地面积、设备采购、软件/系统建设、服务提供能力…' },
      { label: '项目总投资', required: true, type: 'textarea', max: 100, placeholder: '示例：项目总投资**万元，其中企业自筹**万元，银行贷款**万元' },
      { label: '需求描述（可选）', type: 'textarea', max: 1500, placeholder: '报告主旨、重点内容、核心目标…' }
    ]
  },
  reportName: '**公司项目资金申请报告'
};
</script>
<script src="agent-shell.js"></script>
<script src="agent-flow.js"></script>
</body>
</html>
